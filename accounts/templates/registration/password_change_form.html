{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Смена пароля 🔐</h2>
        <p class="subtitle">Введи текущий пароль и придумай новый</p>

        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="errorlist">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить пароль</button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'profile' %}">← Вернуться в профиль</a>
        </p>
    </div>
</div>
{% endblock %}
