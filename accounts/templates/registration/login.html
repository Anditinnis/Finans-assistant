{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>С возвращением 👋</h2>
        <p class="subtitle">Войди, чтобы продолжить управлять бюджетом</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <p class="auth-footer">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
